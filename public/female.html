<!DOCTYPE html>
<html>
<head>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2589/2589175.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Her | Pulse</title>
    <script src="client.js"></script>
    <style>
        /* Rose Cosmic Theme */
        body { margin:0; height:100vh; overflow:hidden; font-family:'Segoe UI', sans-serif; background: radial-gradient(circle at center, #2e1a26 0%, #000000 100%); display:flex; justify-content:center; align-items:center; }
        
        /* ADDED: Starfield Effect (Background Layer) */
        .stars { position:absolute; width:100%; height:100%; background: url('https://www.transparenttextures.com/patterns/stardust.png'); opacity:0.4; pointer-events: none; animation: moveStars 60s linear infinite; }
        @keyframes moveStars { from{background-position:0 0;} to{background-position:100px 100px;} }

        /* Nebula Clouds Effect (Foreground Layer) */
        .nebula { position:absolute; width:100%; height:100%; opacity:0.4; background: radial-gradient(circle at 30% 30%, rgba(255, 117, 140, 0.15), transparent 50%), radial-gradient(circle at 70% 70%, rgba(162, 155, 254, 0.1), transparent 50%); animation: drift 20s ease-in-out infinite alternate; pointer-events: none; }
        @keyframes drift { from{transform:scale(1);} to{transform:scale(1.1);} }

        /* The Button (Cosmic Rose Design) */
        #main-ui { z-index: 10; opacity: 0; transition: opacity 1s; display: flex; flex-direction: column; align-items: center; }
        
        .soul-btn {
            width: 180px; height: 180px;
            border-radius: 50%; border: none;
            /* 3D Rose Gold Gradient */
            background: radial-gradient(circle at 30% 30%, #ffc3d0, #e94560, #2e1a26);
            /* Deep glow + Inner light reflection */
            box-shadow: 0 0 60px rgba(233, 69, 96, 0.4), inset 0 0 30px rgba(255, 255, 255, 0.3);
            font-size: 60px; color: white; cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            animation: pulseSlow 4s infinite ease-in-out;
            display: flex; justify-content: center; align-items: center;
            text-shadow: 0 0 15px rgba(255,255,255,0.8);
        }
        
        .soul-btn:active { transform: scale(0.92); box-shadow: 0 0 30px rgba(233, 69, 96, 0.6), inset 0 0 10px rgba(0,0,0,0.5); }
        
        /* Smooth Breathing Animation */
        @keyframes pulseSlow { 
            0% { box-shadow: 0 0 0 0 rgba(233, 69, 96, 0.2); transform: scale(1); } 
            50% { box-shadow: 0 0 0 25px rgba(233, 69, 96, 0); transform: scale(1.02); } 
            100% { box-shadow: 0 0 0 0 rgba(233, 69, 96, 0); transform: scale(1); } 
        }

        /* THE GHOST PLAYER: Always rendered, just hidden */
        #vid { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: black; 
            z-index: 999;
            
            /* KEY: The element is technically "there" but invisible */
            visibility: hidden; 
            opacity: 0;
            pointer-events: none;
            
            /* Smooth fade in/out */
            transition: opacity 0.2s ease-in-out;
            
            /* Always layout flex, never 'none' */
            display: flex; justify-content: center; align-items: center; 
        }

        /* The class we add to show it */
        #vid.active {
            visibility: visible;
            opacity: 1;
            pointer-events: auto;
        }
        
        video { width: 100%; height: 100%; object-fit: cover; mix-blend-mode: screen; }
        #guard { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); color:white; display:flex; flex-direction:column; justify-content:center; align-items:center; z-index:1000; text-align:center; }
        #guard button { margin-top:20px; padding:10px 20px; background:#e94560; border:none; color:white; border-radius:30px; cursor:pointer; font-weight: bold; letter-spacing: 1px; }
        /* --- ANIMATION CONTAINER --- */
    #anim-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        z-index: 9999; opacity: 0; pointer-events: none;
        transition: opacity 0.5s ease-in-out; /* Slow fade in */
        background-color: #050510;
        display: flex; justify-content: center; align-items: center;
        flex-direction: column; /* Stack elements if needed */
    }
    #anim-overlay.active { opacity: 1; pointer-events: auto; }

    /* The Nebula Background (The one you loved) */
    .cosmic-mix-bg {
        position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
        background-image: url('https://www.transparenttextures.com/patterns/stardust.png'),
        radial-gradient(circle at 30% 40%, rgba(77, 124, 255, 0.2) 0%, transparent 60%),
        radial-gradient(circle at 70% 60%, rgba(233, 69, 96, 0.2) 0%, transparent 60%);
        background-blend-mode: screen;
        opacity: 0.6;
        animation: nebulaDrift 30s infinite alternate ease-in-out;
    }

    /* --- THE MESSAGE TEXT --- */
    .soul-message {
        position: relative; z-index: 10;
        font-family: 'Segoe UI', sans-serif;
        font-weight: 300; /* Very thin/elegant */
        font-size: 1.1rem;
        letter-spacing: 4px; /* Cinematic spacing */
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.9);
        text-align: center;
        opacity: 0;
        transform: scale(0.9);
    }

    /* The "Breath" Animation (2.5s) */
    .active .soul-message {
        animation: messageBreathe 2.5s ease-in-out forwards;
    }

    @keyframes messageBreathe {
        0% { opacity: 0; transform: scale(0.95); filter: blur(5px); }
        
        /* Fade In & Glow Up */
        20% { opacity: 1; transform: scale(1); filter: blur(0px); text-shadow: 0 0 10px rgba(255,255,255,0.5); }
        
        /* The Peak (Brightest) */
        50% { opacity: 1; transform: scale(1.05); text-shadow: 0 0 20px white, 0 0 40px rgba(255,255,255,0.5); }
        
        /* Fade Out */
        100% { opacity: 0; transform: scale(1.1); filter: blur(10px); }
    }
    </style>
</head>
<body>
    <div class="stars"></div>
    <div class="nebula"></div>
    
    <div id="guard">
        <h2 style="font-weight:300; letter-spacing:2px;">Aligning Stars...</h2>
        <button id="perm-btn" style="display:none" onclick="location.reload()">Grant Access</button>
    </div>

    <div id="main-ui">
        <button class="soul-btn" onclick="send()">✦</button>
        <div style="text-align:center; color:rgba(255,255,255,0.6); margin-top:30px; letter-spacing:3px; font-size:0.8em; font-weight: 300;">TOUCH TO SEND LOVE</div>
    </div>

    <div id="anim-overlay">
        <div class="cosmic-mix-bg"></div>
        
        <h2 class="soul-message">Across the distance,<br>I am with you.</h2>
    </div>
    
    <audio id="sfx" src="soul.mp4" preload="auto"></audio>

    <script>
        // 1. Store partner name (Default to 'them' if loading)
        let partnerName = "them";

        // 2. Fetch User Info AND Partner Name
        fetch('/me')
            .then(r => {
                if(r.status===401) window.location.href='/index.html';
                return r.json();
            })
            .then(data => {
                // Save the partner's name if the server sent it
                if(data.partnerName) partnerName = data.partnerName;
            });

        // SMART RESPONSIVE LOGOUT BUTTON
        window.addEventListener('load', () => {
            const b = document.createElement('button');
            b.innerHTML = "LOGOUT"; 
            b.onclick = () => {
                if(confirm("Disconnect from current session?")) {
                    // Checks for BASE_URL (from client.js) to support Mobile Apps
                    const url = (typeof BASE_URL !== 'undefined' && BASE_URL) ? `${BASE_URL}/logout` : '/logout';
                    window.location.href = url;
                }
            };
            
            // Check if we are on a small screen (Mobile)
            const isMobile = window.innerWidth < 768;

            Object.assign(b.style, {
                position: 'fixed',
                
                // SMART POSITIONING:
                // On Mobile: It checks for the "Notch" (safe-area). If no notch, it defaults to 20px.
                // On Desktop: It stays at 25px.
                top: isMobile ? 'max(20px, env(safe-area-inset-top) + 10px)' : '25px',
                right: isMobile ? '20px' : '25px',
                
                // RESPONSIVE SIZING:
                // Smaller padding and font on mobile to look cleaner
                padding: isMobile ? '6px 14px' : '8px 18px',
                fontSize: isMobile ? '0.65rem' : '0.75rem',
                
                // Universal Styles
                background: 'rgba(0, 0, 0, 0.3)',
                color: 'rgba(255, 255, 255, 0.6)',
                border: '1px solid rgba(255, 255, 255, 0.15)',
                borderRadius: '30px',
                cursor: 'pointer',
                letterSpacing: '2px',
                backdropFilter: 'blur(5px)',
                zIndex: 1000,
                transition: 'all 0.3s ease'
            });

            // Hover Effect (Only for Desktop really, but good to have)
            b.onmouseenter = () => {
                b.style.background = 'rgba(255, 255, 255, 0.1)';
                b.style.color = '#fff';
                b.style.borderColor = 'rgba(255, 255, 255, 0.5)';
            };
            b.onmouseleave = () => {
                b.style.background = 'rgba(0, 0, 0, 0.3)';
                b.style.color = 'rgba(255, 255, 255, 0.6)';
                b.style.borderColor = 'rgba(255, 255, 255, 0.15)';
            };

            document.body.appendChild(b);
        });

        let myLoc = null;
        window.onload = () => enforceLocation(
            (l) => { myLoc=l; document.getElementById('guard').style.display='none'; document.getElementById('main-ui').style.opacity='1'; document.getElementById('main-ui').style.pointerEvents='auto'; },
            () => { document.querySelector('#guard h2').innerText="Location Required"; document.getElementById('perm-btn').style.display='block'; }
        );

        // 1. PRE-LOAD: Force the video to load into memory as soon as the app opens
        // This ensures there is no "buffering" delay when you click.
        window.addEventListener('load', () => {
            const sv = document.getElementById('sv');
            sv.load(); 
        });

        async function send() {
            const overlay = document.getElementById('anim-overlay');
            const sfx = document.getElementById('sfx');

            // 1. Reset Animation
            overlay.classList.remove('active');
            void overlay.offsetWidth; 

            // 2. Start Visuals
            overlay.classList.add('active');

            // 3. Play Sound (Optional)
            if(sfx) {
                sfx.currentTime = 0;
                sfx.play().catch(e => console.log("Audio blocked"));
            }

            // 4. Background Logic
            // [REMOVED] The duplicate registerNotifications() call. 
            // Reason: sendLove() inside client.js already does this.
            
            sendLove(myLoc); 

            // 5. Close Automatically after 2.5 Seconds
            setTimeout(() => {
                overlay.classList.remove('active');
                // The alert confirms the technical success
                setTimeout(() => alert(`Your heartbeat has reached ${partnerName}.`), 300);
            }, 2500);
        }
    </script>
</body>
</html>
