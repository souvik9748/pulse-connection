<!DOCTYPE html>
<html>
<head>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2589/2589175.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Him | Pulse</title>
    <script src="client.js"></script>
    <style>
        /* Blue Pulsar Theme */
        body { margin:0; height:100vh; overflow:hidden; font-family:'Segoe UI', sans-serif; background: radial-gradient(circle at center, #0f1c2e 0%, #000000 100%); display:flex; justify-content:center; align-items:center; }
        
        /* Starfield Effect */
        .stars { position:absolute; width:100%; height:100%; background: url('https://www.transparenttextures.com/patterns/stardust.png'); opacity:0.4; pointer-events: none; animation: moveStars 60s linear infinite; }
        @keyframes moveStars { from{background-position:0 0;} to{background-position:100px 100px;} }

        /* The Button (Cosmic Blue Design) */
        #main-ui { z-index: 10; opacity: 0; transition: opacity 1s; display: flex; flex-direction: column; align-items: center; }
        
        .soul-btn {
            width: 180px; height: 180px;
            border-radius: 50%; border: none;
            /* 3D Cosmic Blue Gradient */
            background: radial-gradient(circle at 30% 30%, #a2d9ff, #4d7cff, #0f1c2e);
            /* Deep glow + Inner light reflection */
            box-shadow: 0 0 60px rgba(77, 124, 255, 0.4), inset 0 0 30px rgba(255, 255, 255, 0.3);
            font-size: 60px; color: white; cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            animation: pulseSlow 4s infinite ease-in-out;
            display: flex; justify-content: center; align-items: center;
            text-shadow: 0 0 15px rgba(255,255,255,0.8);
        }
        
        .soul-btn:active { transform: scale(0.92); box-shadow: 0 0 30px rgba(77, 124, 255, 0.6), inset 0 0 10px rgba(0,0,0,0.5); }
        
        /* Smooth Breathing Animation */
        @keyframes pulseSlow { 
            0% { box-shadow: 0 0 0 0 rgba(77, 124, 255, 0.2); transform: scale(1); } 
            50% { box-shadow: 0 0 0 25px rgba(77, 124, 255, 0); transform: scale(1.02); } 
            100% { box-shadow: 0 0 0 0 rgba(77, 124, 255, 0); transform: scale(1); } 
        }

        /* THE GHOST PLAYER: Always rendered, just hidden */
        #vid { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: black; 
            z-index: 999;
            
            /* KEY: The element is technically "there" but invisible */
            visibility: hidden; 
            opacity: 0;
            pointer-events: none;
            
            /* Smooth fade in/out */
            transition: opacity 0.2s ease-in-out;
            
            /* Always layout flex, never 'none' */
            display: flex; justify-content: center; align-items: center; 
        }

        /* The class we add to show it */
        #vid.active {
            visibility: visible;
            opacity: 1;
            pointer-events: auto;
        }
        
        video { width: 100%; height: 100%; object-fit: cover; mix-blend-mode: screen; }
        #guard { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); color:white; display:flex; flex-direction:column; justify-content:center; align-items:center; z-index:1000; text-align:center; }
        #guard button { margin-top:20px; padding:10px 20px; background:#4d7cff; border:none; color:white; border-radius:30px; cursor:pointer; font-weight: bold; letter-spacing: 1px; }
    /* --- ANIMATION CONTAINER --- */
    #anim-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        z-index: 9999; opacity: 0; pointer-events: none;
        transition: opacity 0.5s ease-in-out; /* Slow fade in */
        background-color: #050510;
        display: flex; justify-content: center; align-items: center;
        flex-direction: column; /* Stack elements if needed */
    }
    #anim-overlay.active { opacity: 1; pointer-events: auto; }

    /* The Nebula Background (The one you loved) */
    .cosmic-mix-bg {
        position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
        background-image: url('https://www.transparenttextures.com/patterns/stardust.png'),
        radial-gradient(circle at 30% 40%, rgba(77, 124, 255, 0.2) 0%, transparent 60%),
        radial-gradient(circle at 70% 60%, rgba(233, 69, 96, 0.2) 0%, transparent 60%);
        background-blend-mode: screen;
        opacity: 0.6;
        animation: nebulaDrift 30s infinite alternate ease-in-out;
    }

    /* --- THE MESSAGE TEXT --- */
    .soul-message {
        position: relative; z-index: 10;
        font-family: 'Segoe UI', sans-serif;
        font-weight: 300; /* Very thin/elegant */
        font-size: 1.1rem;
        letter-spacing: 4px; /* Cinematic spacing */
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.9);
        text-align: center;
        opacity: 0;
        transform: scale(0.9);
    }

    /* The "Breath" Animation (2.5s) */
    .active .soul-message {
        animation: messageBreathe 2.5s ease-in-out forwards;
    }

    @keyframes messageBreathe {
        0% { opacity: 0; transform: scale(0.95); filter: blur(5px); }
        
        /* Fade In & Glow Up */
        20% { opacity: 1; transform: scale(1); filter: blur(0px); text-shadow: 0 0 10px rgba(255,255,255,0.5); }
        
        /* The Peak (Brightest) */
        50% { opacity: 1; transform: scale(1.05); text-shadow: 0 0 20px white, 0 0 40px rgba(255,255,255,0.5); }
        
        /* Fade Out */
        100% { opacity: 0; transform: scale(1.1); filter: blur(10px); }
    }
    </style>
</head>
<body>
    <div class="stars"></div>
    
    <div id="guard">
        <h2 style="font-weight:300; letter-spacing:2px;">Establishing Link...</h2>
        <button id="perm-btn" style="display:none" onclick="location.reload()">Grant Access</button>
    </div>

    <div id="main-ui">
        <button class="soul-btn" onclick="send()">✦</button>
        <div style="text-align:center; color:rgba(255,255,255,0.6); margin-top:30px; letter-spacing:3px; font-size:0.8em; font-weight: 300;">TOUCH TO SIGNAL</div>
        
        <button onclick="openDraw()" style="background:none; border:1px solid rgba(255,255,255,0.2); border-radius:50%; width:50px; height:50px; font-size:20px; cursor:pointer; margin-top:20px; color:white; backdrop-filter:blur(5px);">✏️</button>
    </div>

    <div id="anim-overlay">
        <div class="cosmic-mix-bg"></div>
        
        <h2 class="soul-message">Across the distance,<br>I am with you.</h2>
    </div>
    
    <audio id="sfx" src="soul.mp4" preload="auto"></audio>

    <div id="draw-ui" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; z-index:2000; background:rgba(0,0,0,0.9);">
        <canvas id="the-canvas" style="touch-action: none;"></canvas>
        
        <div style="position:fixed; bottom:30px; width:100%; display:flex; justify-content:center; gap:15px; pointer-events:none;">
            <button onclick="clearCanvas()" style="pointer-events:auto; background:#da3633; color:white; border:none; padding:12px 24px; border-radius:30px; font-weight:bold;">CLEAR</button>
            <button onclick="sendDrawing()" style="pointer-events:auto; background:#238636; color:white; border:none; padding:12px 24px; border-radius:30px; font-weight:bold; box-shadow:0 0 15px #238636;">SEND 🚀</button>
            <button onclick="closeDraw()" style="pointer-events:auto; background:#888; color:white; border:none; padding:12px 24px; border-radius:30px; font-weight:bold;">X</button>
        </div>
    </div>

    <img id="ghost-img" style="position:fixed; top:0; left:0; width:100%; height:100%; z-index:1500; pointer-events:none; opacity:0; transition: opacity 1s ease-in-out; mix-blend-mode: screen;">

    <script>
        // 1. Store partner name (Default to 'them' while loading)
        let partnerName = "them";

        // 2. Fetch User Info AND Partner Name
        fetch('/me')
            .then(r => {
                if(r.status===401) window.location.href='/index.html';
                return r.json();
            })
            .then(data => { 
                if(data.partnerName) partnerName = data.partnerName;
                
                // [NEW] CRITICAL FIX: SYNC LOCAL STORAGE WITH SERVER
                // This ensures 'pulse_user' matches the actual logged-in user
                if(data.username) {
                    localStorage.setItem('pulse_user', data.username);
                    console.log("Identity Synced:", data.username);
                }
            });

        // SMART RESPONSIVE LOGOUT BUTTON
        window.addEventListener('load', () => {
            const b = document.createElement('button');
            b.innerHTML = "LOGOUT"; 
            b.onclick = () => {
                if(confirm("Disconnect from current session?")) {
                    // Checks for BASE_URL (from client.js) to support Mobile Apps
                    const url = (typeof BASE_URL !== 'undefined' && BASE_URL) ? `${BASE_URL}/logout` : '/logout';
                    window.location.href = url;
                }
            };
            
            // Check if we are on a small screen (Mobile)
            const isMobile = window.innerWidth < 768;

            Object.assign(b.style, {
                position: 'fixed',
                
                // SMART POSITIONING:
                // On Mobile: It checks for the "Notch" (safe-area). If no notch, it defaults to 20px.
                // On Desktop: It stays at 25px.
                top: isMobile ? 'max(20px, env(safe-area-inset-top) + 10px)' : '25px',
                right: isMobile ? '20px' : '25px',
                
                // RESPONSIVE SIZING:
                // Smaller padding and font on mobile to look cleaner
                padding: isMobile ? '6px 14px' : '8px 18px',
                fontSize: isMobile ? '0.65rem' : '0.75rem',
                
                // Universal Styles
                background: 'rgba(0, 0, 0, 0.3)',
                color: 'rgba(255, 255, 255, 0.6)',
                border: '1px solid rgba(255, 255, 255, 0.15)',
                borderRadius: '30px',
                cursor: 'pointer',
                letterSpacing: '2px',
                backdropFilter: 'blur(5px)',
                zIndex: 1000,
                transition: 'all 0.3s ease'
            });

            // Hover Effect (Only for Desktop really, but good to have)
            b.onmouseenter = () => {
                b.style.background = 'rgba(255, 255, 255, 0.1)';
                b.style.color = '#fff';
                b.style.borderColor = 'rgba(255, 255, 255, 0.5)';
            };
            b.onmouseleave = () => {
                b.style.background = 'rgba(0, 0, 0, 0.3)';
                b.style.color = 'rgba(255, 255, 255, 0.6)';
                b.style.borderColor = 'rgba(255, 255, 255, 0.15)';
            };

            document.body.appendChild(b);
        });

        let myLoc = null;
        window.onload = () => enforceLocation(
            (l) => { myLoc=l; document.getElementById('guard').style.display='none'; document.getElementById('main-ui').style.opacity='1'; document.getElementById('main-ui').style.pointerEvents='auto'; },
            () => { document.querySelector('#guard h2').innerText="Location Required"; document.getElementById('perm-btn').style.display='block'; }
        );

        // 1. PRE-LOAD: Force the video to load into memory as soon as the app opens
        // This ensures there is no "buffering" delay when you click.
        window.addEventListener('load', () => {
            const sv = document.getElementById('sv');
            sv.load(); 
        });

        async function send() {
            const overlay = document.getElementById('anim-overlay');
            const sfx = document.getElementById('sfx');

            // 1. Reset Animation
            overlay.classList.remove('active');
            void overlay.offsetWidth; 

            // 2. Start Visuals
            overlay.classList.add('active');

            // 3. Play Sound (Optional)
            if(sfx) {
                sfx.currentTime = 0;
                sfx.play().catch(e => console.log("Audio blocked"));
            }

            // 4. Background Logic
            // [REMOVED] The duplicate registerNotifications() call. 
            // Reason: sendLove() inside client.js already does this.
            
            sendLove(myLoc); 

            // 5. Close Automatically after 2.5 Seconds
            setTimeout(() => {
                overlay.classList.remove('active');
                // The alert confirms the technical success
                setTimeout(() => alert(`Your heartbeat has reached ${partnerName}.`), 300);
            }, 2500);
        }

        // --- DRAWING LOGIC (Paste at the bottom of script) ---
        const canvas = document.getElementById('the-canvas');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;

        // Setup Canvas
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            ctx.strokeStyle = "#00ffcc"; // Neon Cyan for Him
            ctx.lineWidth = 5;
            ctx.lineCap = "round";
            ctx.shadowBlur = 15;
            ctx.shadowColor = "#00ffcc";
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Controls
        function openDraw() { document.getElementById('draw-ui').style.display = 'block'; resizeCanvas(); }
        function closeDraw() { document.getElementById('draw-ui').style.display = 'none'; }
        function clearCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); }

        // Drawing Events
        function start(e) { isDrawing = true; draw(e); }
        function end() { isDrawing = false; ctx.beginPath(); }
        function draw(e) {
            if (!isDrawing) return;
            const x = e.clientX || e.touches[0].clientX;
            const y = e.clientY || e.touches[0].clientY;
            ctx.lineTo(x, y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x, y);
        }
        
        // Attach Listeners
        canvas.addEventListener('mousedown', start);
        canvas.addEventListener('touchstart', start);
        canvas.addEventListener('mouseup', end);
        canvas.addEventListener('touchend', end);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('touchmove', draw);

        // [UPDATED] Send Function (Handles Blocking)
        async function sendDrawing() {
            const btn = document.querySelector('#draw-ui button:nth-child(2)');
            const originalText = btn.innerText;
            btn.innerText = "CHECKING...";
            
            // Compress Image Logic (Keep your existing compression code here)
            // ... (The canvas compression lines we added before) ...
            const w = canvas.width; const h = canvas.height;
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = w; tempCanvas.height = h;
            const tCtx = tempCanvas.getContext('2d');
            tCtx.fillStyle = "#000000"; tCtx.fillRect(0, 0, w, h);
            tCtx.drawImage(canvas, 0, 0);
            const dataUrl = tempCanvas.toDataURL('image/jpeg', 0.5); 
            // -----------------------------------------------------

            const me = localStorage.getItem('pulse_user'); 

            try {
                const res = await fetch('/draw/send', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ sender: me, image: dataUrl })
                });
                const data = await res.json();

                if (data.success) {
                    alert("Sent! Waiting for them to view it.");
                    clearCanvas();
                    closeDraw();
                } else if (data.status === 'pending') {
                    // BLOCKING ALERT
                    alert(data.message); 
                } else {
                    alert("Error sending drawing.");
                }
            } catch(e) {
                alert("Network Error");
            }
            btn.innerText = originalText;
        }

        // [UPDATED] Check Function (30 Second View Time)
        setInterval(async () => {
            const me = localStorage.getItem('pulse_user');
            if (!me) return;

            try {
                const res = await fetch(`/draw/check?user=${me}`);
                const data = await res.json();

                if (data.hasDrawing) {
                    const img = document.getElementById('ghost-img');
                    img.src = data.image;
                    
                    // 1. Show Image
                    img.style.opacity = "1"; 
                    
                    // 2. Play Sound
                    const sfx = document.getElementById('sfx');
                    if(sfx) sfx.play().catch(e=>console.log(e));

                    // 3. Wait 30 Seconds, then Fade Out
                    setTimeout(() => {
                        img.style.opacity = "0";
                        setTimeout(() => { img.src = ""; }, 1000); // Cleanup memory
                    }, 5000); // <--- 5 Seconds
                }
            } catch (e) { }
        }, 5000);
    </script>
</body>
</html>
