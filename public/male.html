<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Him | Pulse</title>
    <script src="client.js"></script>
    <style>
        /* Blue Pulsar Theme */
        body { margin:0; height:100vh; overflow:hidden; font-family:'Segoe UI', sans-serif; background: radial-gradient(circle at center, #0f1c2e 0%, #000000 100%); display:flex; justify-content:center; align-items:center; }
        
        /* Starfield Effect */
        .stars { position:absolute; width:100%; height:100%; background: url('https://www.transparenttextures.com/patterns/stardust.png'); opacity:0.4; pointer-events: none; animation: moveStars 60s linear infinite; }
        @keyframes moveStars { from{background-position:0 0;} to{background-position:100px 100px;} }

        /* The Button (Signal) */
        #main-ui { z-index: 10; opacity: 0; transition: opacity 1s; }
        .soul-btn {
            width: 180px; height: 180px;
            border-radius: 50%; border: none;
            background: radial-gradient(circle, #4d7cff, #1a1a2e);
            box-shadow: 0 0 50px rgba(77, 124, 255, 0.3), inset 0 0 20px rgba(255, 255, 255, 0.2);
            font-size: 60px; color: white; cursor: pointer;
            transition: all 0.3s;
            animation: pulseSignal 3s infinite;
            display: flex; justify-content: center; align-items: center;
        }
        .soul-btn:active { transform: scale(0.9); box-shadow: 0 0 30px rgba(77, 124, 255, 0.6); }
        @keyframes pulseSignal { 0% {box-shadow: 0 0 0 0 rgba(77, 124, 255, 0.4);} 70% {box-shadow: 0 0 0 30px rgba(77, 124, 255, 0);} 100% {box-shadow: 0 0 0 0 rgba(77, 124, 255, 0);} }

        /* Video & Guard */
        #vid { position:fixed; top:0; left:0; width:100%; height:100%; background:black; display:none; justify-content:center; align-items:center; z-index:999; }
        video { width:100%; height:100%; object-fit:cover; mix-blend-mode:screen; }
        #guard { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); color:white; display:flex; flex-direction:column; justify-content:center; align-items:center; z-index:1000; text-align:center; }
        #guard button { margin-top:20px; padding:10px 20px; background:#4d7cff; border:none; color:white; border-radius:5px; cursor:pointer; }
    </style>
</head>
<body>
    <div class="stars"></div>
    
    <div id="guard">
        <h2 style="font-weight:300; letter-spacing:2px;">Establishing Link...</h2>
        <button id="perm-btn" style="display:none" onclick="location.reload()">Grant Access</button>
    </div>

    <div id="main-ui">
        <button class="soul-btn" onclick="send()">📡</button>
        <div style="text-align:center; color:rgba(255,255,255,0.5); margin-top:20px; letter-spacing:1px; font-size:0.9em;">TAP TO SIGNAL</div>
    </div>

    <div id="vid"><video id="sv" src="soul.mp4" playsinline></video></div>

    <script>
        // 1. Store partner name (Default to 'them' while loading)
        let partnerName = "them";

        // 2. Fetch User Info AND Partner Name
        fetch('/me')
            .then(r => {
                if(r.status===401) window.location.href='/index.html';
                return r.json();
            })
            .then(data => {
                // Save the partner's name if the server sent it
                if(data.partnerName) partnerName = data.partnerName;
            });

        // Logout Button
        window.addEventListener('load',()=>{const b=document.createElement('button');b.innerText="Logout";b.onclick=()=>window.location.href='/logout';Object.assign(b.style,{position:'fixed',top:'20px',right:'20px',background:'transparent',color:'rgba(255,255,255,0.5)',border:'1px solid rgba(255,255,255,0.3)',padding:'5px 15px',borderRadius:'20px',cursor:'pointer',zIndex:1000});document.body.appendChild(b);});

        let myLoc = null;
        window.onload = () => enforceLocation(
            (l) => { myLoc=l; document.getElementById('guard').style.display='none'; document.getElementById('main-ui').style.opacity='1'; document.getElementById('main-ui').style.pointerEvents='auto'; },
            () => { document.querySelector('#guard h2').innerText="Location Required"; document.getElementById('perm-btn').style.display='block'; }
        );

        async function send() {
            // 1. Try to register notifications FIRST (iOS requires this click)
            try {
                // Check if function exists in client.js, if so, run it
                if (typeof registerNotifications === "function") {
                    await registerNotifications();
                }
            } catch (err) {
                console.log("Notification setup skipped or failed:", err);
            }

            // 2. Proceed with sending love
            sendLove(myLoc); 
            
            const v=document.getElementById('vid'); const sv=document.getElementById('sv');
            v.style.display='flex'; sv.currentTime=0; sv.play();
            
            sv.onended=()=>{ 
                v.style.display='none'; 
                // Use the partner name variable we set earlier
                alert(`Your heartbeat has reached ${partnerName}.`); 
            };
        }
    </script>
</body>
</html>
