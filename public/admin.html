<!DOCTYPE html>
<html>
<head>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2589/2589175.png">
    <title>Pulse | Admin</title>
    <style>
        body { background:#0d1117; color:#c9d1d9; font-family:'Segoe UI', sans-serif; padding:40px; }
        
        /* Header */
        h1 { margin-bottom: 30px; border-bottom: 1px solid #30363d; padding-bottom: 20px; color: #58a6ff; font-weight: 300; letter-spacing: 1px; }
        h2 { margin-top: 50px; color: #8b949e; font-size: 1.2em; text-transform: uppercase; letter-spacing: 1px; }

        /* Filter Card */
        .card { background:#161b22; border: 1px solid #30363d; border-radius: 6px; padding: 20px; margin-bottom: 30px; display:flex; gap:15px; align-items:center; }
        label { font-weight:bold; color:#f0f6fc; }
        
        /* Inputs */
        select, input { background: #0d1117; border: 1px solid #30363d; color: #c9d1d9; padding: 8px 12px; border-radius: 6px; outline:none; }
        button { background: #238636; color: white; border: 1px solid rgba(27,31,35,0.15); padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        button:hover { background: #2ea043; }
        button.secondary { background: #1f6feb; }
        button.secondary:hover { background: #388bfd; }

        /* Tables */
        table { width:100%; border-collapse:collapse; margin-top:15px; background:#161b22; border-radius:6px; overflow:hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        th { background: #21262d; text-align: left; padding: 15px; color: #8b949e; font-size: 0.85em; text-transform: uppercase; }
        td { padding: 15px; border-top: 1px solid #30363d; font-size: 0.95em; }
        tr:hover td { background: #21262d; }
        
        a { color: #58a6ff; text-decoration:none; }
        a:hover { text-decoration:underline; }

        /* Badges */
        .badge { background: #1f6feb; color: white; padding: 2px 8px; border-radius: 20px; font-size: 0.8em; font-weight: bold; }
        
        /* DB Viewer */
        .db-box { margin-top: 50px; border-top: 1px solid #30363d; padding-top: 20px; }
        #json-viewer { background: #010409; padding: 20px; border-radius: 6px; overflow: auto; max-height: 400px; font-family: 'Consolas', monospace; color: #79c0ff; border: 1px solid #30363d; margin-top: 10px; }
    </style>
</head>
<body>
    <h1>Pulse Monitor</h1>

    <div class="card">
        <label>Filter View:</label>
        <select id="userList"><option value="">All Users</option></select>
        <input type="date" id="dateList">
        <button onclick="applyFilters()">Apply</button>
        <button class="secondary" onclick="applyFilters()" style="margin-left:auto">Refresh</button>
    </div>

    <h2>Connection Velocity</h2>
    <table id="stats-table">
        <thead><tr><th>User</th><th>Signals Sent</th></tr></thead>
        <tbody id="stats-body"><tr><td colspan="2">Loading...</td></tr></tbody>
    </table>

    <h2>Signal Logs</h2>
    <table id="logs">
        <thead><tr><th>Time</th><th>Sender</th><th>Receiver</th><th>Message</th><th>Location</th></tr></thead>
        <tbody id="logs-body"><tr><td colspan="5">Loading...</td></tr></tbody>
    </table>

    <div class="db-box">
        <h3>Raw Database Access</h3>
        <button onclick="viewDB()" style="background:#21262d; border:1px solid #30363d;">Fetch JSON</button>
        <pre id="json-viewer"></pre>
    </div>

    <script>
        let userMap = {}; 

        // 1. Fetch Users on Load
        fetch('/admin/users')
            .then(r => r.json())
            .then(users => {
                const select = document.getElementById('userList');
                users.forEach(user => {
                    select.innerHTML += `<option value="${user.username}">${user.fullName || user.username}</option>`;
                    userMap[user.username] = user.fullName || user.username;
                });
                // Initial Load
                applyFilters();
            })
            .catch(err => console.error("Error loading users:", err));

        function applyFilters(){ 
            const user = document.getElementById('userList').value; 
            const date = document.getElementById('dateList').value; 
            loadStats(user, date); 
            loadHistory(user, date); 
        }

        async function loadStats(user, date){
            const tbody = document.getElementById('stats-body'); 
            tbody.innerHTML = '<tr><td colspan="2">Loading...</td></tr>';
            
            try {
                const res = await fetch(`/admin/history?user=${user}&date=${date}`); 
                const data = await res.json();
                
                // Count messages per sender
                const counts = {}; 
                data.forEach(log => {
                    counts[log.sender] = (counts[log.sender] || 0) + 1;
                });

                // Sort by count descending
                const sorted = Object.entries(counts).sort((a,b) => b[1] - a[1]);
                
                let html = ''; 
                if(sorted.length === 0) {
                    html = '<tr><td colspan="2" style="color:#888">No activity found</td></tr>';
                } else {
                    sorted.forEach(([username, count]) => { 
                        html += `<tr>
                            <td>${userMap[username] || username}</td>
                            <td><span class="badge">${count}</span></td>
                        </tr>`; 
                    });
                }
                tbody.innerHTML = html;
            } catch(e) { tbody.innerHTML = '<tr><td colspan="2">Error loading stats</td></tr>'; }
        }

        async function loadHistory(user, date){
            const tbody = document.getElementById('logs-body'); 
            tbody.innerHTML = '<tr><td colspan="5">Loading...</td></tr>';
            
            try {
                const res = await fetch(`/admin/history?user=${user}&date=${date}`); 
                const data = await res.json();
                
                let html = ''; 
                if(data.length === 0) {
                    html = '<tr><td colspan="5" style="color:#888">No logs found</td></tr>';
                } else {
                    data.forEach(log => { 
                        let locationLink = '-'; 
                        if(log.location && log.location.lat) {
                            locationLink = `<a href="https://maps.google.com/?q=${log.location.lat},${log.location.lng}" target="_blank">Map ↗</a>`;
                        }
                        
                        html += `<tr>
                            <td>${new Date(log.timestamp).toLocaleString()}</td>
                            <td>${log.sender}</td>
                            <td>${log.receiver}</td>
                            <td>${log.message}</td>
                            <td>${locationLink}</td>
                        </tr>`; 
                    });
                }
                tbody.innerHTML = html;
            } catch(e) { tbody.innerHTML = '<tr><td colspan="5">Error loading logs</td></tr>'; }
        }

        async function viewDB(){
            const viewer = document.getElementById('json-viewer'); 
            viewer.innerText = "Loading...";
            try {
                const res = await fetch('/admin/db'); 
                const data = await res.json();
                viewer.innerText = JSON.stringify(data, null, 2);
            } catch(e) { viewer.innerText = "Error fetching DB"; }
        }

        // --- ADMIN LOGOUT BUTTON ---
        const logoutBtn = document.createElement('button');
        logoutBtn.innerHTML = "LOGOUT";
        
        // Admin Theme Styles (Red/Danger)
        Object.assign(logoutBtn.style, {
            position: 'fixed',
            top: '30px',
            right: '40px',
            background: '#da3633', // GitHub 'Danger' Red
            color: 'white',
            border: '1px solid rgba(27,31,35,0.15)',
            padding: '8px 16px',
            borderRadius: '6px',
            fontWeight: '600',
            cursor: 'pointer',
            zIndex: 1000,
            boxShadow: '0 3px 10px rgba(0,0,0,0.2)'
        });

        logoutBtn.onmouseenter = () => logoutBtn.style.background = '#b92b27';
        logoutBtn.onmouseleave = () => logoutBtn.style.background = '#da3633';

        logoutBtn.onclick = () => {
            if(confirm("Log out of Admin Console?")) {
                window.location.href = '/logout';
            }
        };

        document.body.appendChild(logoutBtn);
    </script>
</body>
</html>
