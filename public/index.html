<!DOCTYPE html>
<html>
<head>
    <title>Pulse | Login</title>
    <script src="client.js"></script>
    <style>
        /* COSMIC THEME */
        body { margin:0; height:100vh; overflow:hidden; font-family:'Segoe UI', sans-serif; display:flex; justify-content:center; align-items:center; color:white; background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%); }
        
        /* Stars Background Animation */
        .stars { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; background-image: radial-gradient(white 1px, transparent 1px), radial-gradient(white 1px, transparent 1px); background-size: 50px 50px; background-position: 0 0, 25px 25px; opacity: 0.3; animation: spaceTime 60s linear infinite; }
        @keyframes spaceTime { from {transform: scale(1);} to {transform: scale(1.5);} }

        /* Glass Card */
        .card { position: relative; width: 320px; padding: 40px; background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.5); text-align: center; z-index: 10; }
        
        /* Typography */
        h1 { margin: 0 0 10px; font-weight: 300; letter-spacing: 4px; text-transform: uppercase; background: linear-gradient(to right, #fff, #a29bfe); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .line { width: 50px; height: 2px; background: #e94560; margin: 0 auto 30px; box-shadow: 0 0 10px #e94560; }

        /* Inputs */
        input { width: 100%; padding: 12px; margin: 10px 0; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: white; outline: none; transition: 0.3s; box-sizing: border-box; }
        input:focus { border-color: #a29bfe; box-shadow: 0 0 10px rgba(162, 155, 254, 0.3); }

        /* Button */
        button { width: 100%; padding: 12px; margin-top: 20px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; transition: 0.3s; letter-spacing: 1px; }
        button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(118, 75, 162, 0.4); }

        /* Links */
        a { color: rgba(255,255,255,0.6); text-decoration: none; font-size: 0.9em; transition: 0.3s; }
        a:hover { color: white; }
    </style>
</head>
<body>
    <div class="stars"></div>
    <div class="card">
        <h1>Pulse</h1>
        <div class="line"></div>
        <input type="text" id="u" placeholder="Username" autocomplete="off">
        <input type="password" id="p" placeholder="Password">
        <button onclick="login()">ENTER VOID</button>
        <p style="margin-top:20px;"><a href="register.html">Create a Soul ID</a></p>
    </div>

    <script>
        async function login() {
            const u = document.getElementById('u').value;
            const p = document.getElementById('p').value;
            if(!u || !p) return alert("Please fill in all fields");
            
            const btn = document.querySelector('button');
            btn.innerHTML = "CONNECTING...";
            
            try {
                const res = await fetch('/login', {
                    method:'POST', headers:{'Content-Type':'application/json'},
                    body:JSON.stringify({ username:u, password:p })
                });
                const d = await res.json();
                if(d.success) {
                    localStorage.setItem('pulse_user', d.username);
                    if(window.registerNotifications) await registerNotifications().catch(console.error);
                    window.location.href = d.redirect;
                } else {
                    alert(d.message);
                    btn.innerHTML = "ENTER VOID";
                }
            } catch(e) { alert("Server Offline"); btn.innerHTML = "ENTER VOID"; }
        }
    </script>
</body>
</html>
